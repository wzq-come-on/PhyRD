seed: 42
device: cuda:0
stage: residual
data:
  format: diffcast_h5
  root: /test1/wzq/Weather/PhyDNet/data/sevir/sevir_vil_only_25frames_384_diffcast.h5
  split: train
  max_samples: 16
  input_frames: 5
  output_frames: 20
  window_start_index: 0
  model_resolution: 128
  spatial_preprocess: diffcast_bilinear
  batch_size: 1
  num_workers: 0
model:
  diffusion_steps: 32
  freeze_deterministic: true
  deterministic:
    name: phydnet_external
    params:
      root: /test1/wzq/Weather/PhyDNet
      model_resolution: 128
  deterministic_checkpoint: /test1/wzq/Weather/PhyDNet/save/sevir_diffcast_setting/phydnet_sevir_5in20out_best.pth
  probabilistic:
    name: rescasformer
    params:
      image_size: 128
      patch_size: 8
      frame_hidden_size: 64
      frame_depth: 2
      frame_heads: 4
      sequence_hidden_size: 128
      sequence_depth: 2
      sequence_heads: 4
      gradient_checkpointing: false
      diffusion_steps: 32
      prediction_type: v
      residual_stats_path: artifacts/calibration/phydnet_residual_stats_train_5to20.json
optimization:
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.00001
  max_steps: 4
  scheduler: constant
  log_every: 1
  precision: bf16
  grad_clip: 1.0
validation:
  enabled: false
post_training_test:
  enabled: false
physics:
  enabled: false
  robust_scale: 0.05
  tolerance: 0.1
  gamma_nadv: 1.0
  pool_sizes: [8, 16, 32]
  alpha_mass: 0.25
  lambda_train: 0.0
artifacts:
  root: artifacts/smoke
  deterministic_name: phydnet_external
  probabilistic_name: rescasformer
